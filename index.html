<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Observatório de Economia Digital</title>
    <!--
      Bloqueia a pintura de propósito: aplica o tema salvo antes do primeiro
      frame, senão quem escolheu o escuro vê a tela piscar em claro. O padrão é
      o claro — o sistema operacional não decide. Precisa ser inline: em arquivo
      externo perde o efeito.
    -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('observatorio:tema')
          document.documentElement.dataset.theme = salvo === 'dark' ? 'dark' : 'light'
        } catch (erro) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
